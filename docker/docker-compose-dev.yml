version: '3.9'

services:
  db:
    image: postgres:16
    container_name: adonis_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adonis
      POSTGRES_PASSWORD: adonis
      POSTGRES_DB: adonis_dev
    ports:
      - '5434:5432'
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adonis -d adonis_dev']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - adonis_net

volumes:
  pg_dev_data:

networks:
  adonis_net:
    driver: bridge
