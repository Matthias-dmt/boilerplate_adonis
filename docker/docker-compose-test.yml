version: '3.9'

services:
  db:
    image: postgres:16
    container_name: adonis_test_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adonis
      POSTGRES_PASSWORD: adonis
      POSTGRES_DB: adonis_test
    ports:
      - '5433:5432'
    volumes:
      - pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adonis -d adonis_test']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - adonis_net

volumes:
  pg_test_data:

networks:
  adonis_net:
    driver: bridge
